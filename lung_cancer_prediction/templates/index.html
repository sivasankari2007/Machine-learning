<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lung Cancer Prediction & Grad-CAM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            /* FIXED: Using relative path for Flask */
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), 
                              url("/static/lung_image.png"); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 900px;
            width: 95%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .upload-btn {
            background-color: #007bff;
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .upload-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .image-stack {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 25px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: black; /* Prevents white flicker during load */
        }

        .base-img {
            width: 100%;
            display: block;
        }

        .heatmap-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.5; 
            pointer-events: none;
        }

        input[type=range] {
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="main-card">
    <h1 class="fw-bold mb-2">Lung Cancer Prediction & Grad-CAM</h1>
    <p class="text-muted mb-4">Upload a lung scan to detect and visualize potential cancerous areas</p>

    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" class="form-control d-inline-block w-auto mb-3" required>
        <br>
        <button type="submit" class="upload-btn">Upload & Predict</button>
    </form>

    {% if prediction %}
    <div class="mt-4 pt-4 border-top">
        <h3 class="fw-bold">Prediction: <span class="text-primary">{{ prediction }}</span></h3>
        <p class="text-secondary px-md-5">{{ recommendation }}</p>

        <h4 class="mt-5 fw-bold">Grad-CAM Visualization</h4>
        
        <div class="mb-2">
            <small class="text-muted">Blend Grad-CAM:</small><br>
            <input type="range" id="gradcamBar" min="0" max="100" value="50">
        </div>

        <div class="image-stack">
            <img src="{{ uploaded_img }}" class="base-img">
            <img src="{{ gradcam_img }}" id="heatmapLayer" class="heatmap-img">
        </div>
    </div>
    {% endif %}
</div>

<script>
    const bar = document.getElementById('gradcamBar');
    const layer = document.getElementById('heatmapLayer');

    if (bar && layer) {
        bar.addEventListener('input', function() {
            layer.style.opacity = this.value / 100;
        });
    }
</script>

</body>
</html>
